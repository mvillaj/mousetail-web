<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mousetail — Shot log, dial-in coach and ES1 profiles</title>
    <meta
      name="description"
      content="A shot log and dial-in coach for espresso at home, with pressure-profile editing for the Fellow Espresso Series 1."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mousetail" />
    <meta property="og:title" content="Mousetail — Shot log, dial-in coach and ES1 profiles" />
    <meta
      property="og:description"
      content="A shot log and dial-in coach for espresso at home, with pressure-profile editing for the Fellow Espresso Series 1."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- Kept in step with the chosen theme and finish by syncThemeColor in
         src/lib/theme.tsx; this is the light crema ground everyone opens on. -->
    <meta name="theme-color" content="#f7f3ee" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mousetail" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Resolve the theme before the stylesheet paints, so a light-mode reload
         never flashes the dark palette. Kept inline and dependency-free on
         purpose: anything deferred is already too late. -->
    <script>
      (function () {
        try {
          // No saved choice means light; only an explicit "auto" follows the OS.
          var p = localStorage.getItem('brewlab.theme');
          if (p === 'auto') {
            p = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } else if (p !== 'dark') {
            p = 'light';
          }
          document.documentElement.dataset.theme = p;
          var f = localStorage.getItem('brewlab.finish');
          var known = [
            'crema',
            'sesame-walnut',
            'cherry-walnut',
            'marine-walnut',
            'woodland-walnut',
            'chocolate-maple',
            'black',
          ];
          document.documentElement.dataset.finish = known.indexOf(f) >= 0 ? f : 'crema';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.finish = 'crema';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
