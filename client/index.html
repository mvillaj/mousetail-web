    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Resolve the theme before the stylesheet paints, so a light-mode reload
         never flashes the dark palette. Kept inline and dependency-free on
         purpose: anything deferred is already too late. -->
    <script>
      (function () {
        try {
          // No saved choice means light; only an explicit "auto" follows the OS.
          var p = localStorage.getItem('brewlab.theme');
          if (p === 'auto') {
            p = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } else if (p !== 'dark') {
            p = 'light';
          }
          document.documentElement.dataset.theme = p;
          var f = localStorage.getItem('brewlab.finish');
          var known = [
            'crema',
            'sesame-walnut',
            'cherry-walnut',
            'marine-walnut',
            'woodland-walnut',
            'chocolate-maple',
            'black',
          ];
          document.documentElement.dataset.finish = known.indexOf(f) >= 0 ? f : 'crema';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.finish = 'crema';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
